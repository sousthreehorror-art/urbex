<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chargement</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff;
    font-family:"Courier New", monospace; overflow:hidden; }
  body::after { content:""; position:fixed; top:0; left:0; right:0; bottom:0;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.25) 0, rgba(0,0,0,.25) 2px, transparent 2px, transparent 4px); }
  #centre { position:absolute; top:50%; left:50%; width:60%;
    transform:translate(-50%,-50%); text-align:center; }
  h1 { font-size:48px; letter-spacing:8px; margin:0 0 10px; color:#ffbe46; }
  #map { color:#aaa; margin-bottom:40px; }#barre { height:10px; border:1px solid #ffbe46; }
  #remplissage { height:100%; width:0; background:#ffbe46; }
  #fichier { margin-top:14px; font-size:14px; color:#888; height:18px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #statut { margin-top:8px; color:#ffbe46; }
  #rec { position:absolute; top:30px; left:40px; font-size:24px; }
  #rec span { color:#dc1e1e; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div id="rec"><span>●</span> REC</div>
<div id="centre">
  <h1 id="titre">URBEX</h1>
  <div id="map"></div>
  <div id="barre"><div id="remplissage"></div></div>
  <div id="fichier"></div>
  <div id="statut">Connexion...</div>
</div>
<script>
var total = 0, restant = 0;

function maj() {
  var pct = total > 0 ? ((total - restant) / total) * 100 : 0;
  document.getElementById("remplissage").style.width = pct + "%";
}

// fonctions appelées automatiquement par GMod
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  document.getElementById("titre").textContent = servername || "URBEX";
  document.getElementById("map").textContent = mapname ? "Map : " + mapname : "";
}
function SetFilesTotal(t)      { total = t; maj(); }
function SetFilesNeeded(n)     { restant = n; maj(); }
function DownloadingFile(f)    { document.getElementById("fichier").textContent = f; }
function SetStatusChanged(s)   { document.getElementById("statut").textContent = s; }
</script>
</body>
</html>
